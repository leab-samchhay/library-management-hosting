<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
  <div id="chart"></div>
  <script>
    var options = {
      series: [
        {
          data: [
            {
              x: 'Category 1',
              y: 50,
              children: [
                { x: 'Sub 1', y: 30 },
                { x: 'Sub 2', y: 20 }
              ]
            }
          ]
        }
      ],
      chart: {
        type: 'sunburst',
        height: 350
      },
      tooltip: {
        custom: function({series, seriesIndex, dataPointIndex, w}) {
          return '<div class="custom-tooltip">Custom</div>';
        },
        y: {
          formatter: function(val) {
            return val + " items";
          }
        }
      }
    };
    var chart = new ApexCharts(document.querySelector("#chart"), options);
    chart.render();
  </script>
</body>
</html>
